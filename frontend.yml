# ===========================================================================
#  Cloud Resume Challenge — .github/workflows/frontend.yml
#  Step 13/14 — CI/CD pipeline for the static frontend
#
#  Trigger: push to main that changes frontend/ files
#  Actions:  1. Upload HTML/CSS/JS to S3
#            2. Invalidate CloudFront cache
#
#  Auth:     OIDC — no long-lived AWS keys stored in GitHub  (top differentiator)
# ===========================================================================

name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch:      # allow manual trigger

permissions:
  id-token: write         # required for OIDC
  contents: read

jobs:
  deploy-frontend:
    name: Upload to S3 & Invalidate CloudFront
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Configure AWS via OIDC (no access keys!) ─────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region:     ap-south-1

      # ── 3. Sync frontend files to S3 ────────────────────────────────────
      - name: Sync frontend → S3
        run: |
          aws s3 sync frontend/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --delete \
            --cache-control "max-age=3600" \
            --exclude "*.map"

      # ── 4. Invalidate CloudFront so visitors see the new version ─────────
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} \
            --paths "/*"

      # ── 5. Print live URL ───────────────────────────────────────────────
      - name: Deployment summary
        run: echo "✅ Frontend deployed to https://${{ secrets.DOMAIN_NAME }}"
