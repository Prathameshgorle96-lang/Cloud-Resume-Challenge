# ===========================================================================
#  Cloud Resume Challenge — .github/workflows/backend.yml
#  Step 13/14 — CI/CD pipeline for the API backend
#
#  Trigger: push to main that changes backend/ or infrastructure/ files
#  Actions:  1. Run pytest + moto unit tests
#            2. terraform plan / apply (via OIDC, no keys stored)
#
#  Auth:     OIDC — no long-lived AWS keys in GitHub  (top differentiator)
# ===========================================================================

name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infrastructure/**"
  workflow_dispatch:

permissions:
  id-token: write         # required for OIDC
  contents: read

env:
  TF_WORKING_DIR: infrastructure/environments/dev
  AWS_REGION:     ap-south-1
  PYTHON_VERSION: "3.12"

jobs:
  # ── Job 1: Unit tests ───────────────────────────────────────────────────
  test:
    name: Run Python Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run pytest (with moto mock)
        run: |
          pytest backend/tests/test_lambda.py -v \
            --tb=short \
            --cov=backend/lambda \
            --cov-report=term-missing

  # ── Job 2: Terraform deploy (only if tests pass) ─────────────────────────
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    needs: test             # gate: tests must pass first
    environment: production

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # OIDC auth — GitHub receives a short-lived token, no secrets needed
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="domain_name=${{ secrets.DOMAIN_NAME }}" \
            -var="root_domain=${{ secrets.ROOT_DOMAIN }}" \
            -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Print API endpoint
        run: terraform output api_endpoint
